name: Build CHESS ARENA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Setup Gradle 8.7 (with caching)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Unit tests (chess rules)
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CHESS-ARENA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed release APK (only when signing secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            gradle --no-daemon assembleRelease
            echo "RELEASE_BUILT=true" >> "$GITHUB_ENV"
          else
            echo "No signing secrets configured - skipping release build."
          fi
      - name: Upload release APK
        if: env.RELEASE_BUILT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CHESS-ARENA-release-apk
          path: app/build/outputs/apk/release/app-release.apk

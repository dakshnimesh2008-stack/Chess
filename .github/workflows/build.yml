name: Build CHESS ARENA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find or unzip project
        run: |
          F=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$F" ]; then
            Z=$(find . -iname "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -z "$Z" ]; then
              echo "ERROR: no project and no zip found. Files in repo:"
              find . -not -path "./.git/*" | head -n 80
              exit 1
            fi
            echo "Unzipping $Z"
            mkdir -p _project
            unzip -q "$Z" -d _project
            F=$(find _project -name settings.gradle.kts | head -n 1)
          fi
          D=$(dirname "$F")
          echo "Project folder: $D"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle 8.7 (with caching)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CHESS-ARENA-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
      - name: Unit tests (chess rules, does not block APK)
        continue-on-error: true
        run: gradle -p "$PROJECT_DIR" --no-daemon testDebugUnitTest

name: Build CHESS ARENA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        run: |
          F=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$F" ]; then
            echo "ERROR: settings.gradle.kts not found. Files in repo:"
            find . -not -path "./.git/*" | head -n 80
            exit 1
          fi
          D=$(dirname "$F")
          echo "Project folder: $D"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle 8.7 (with caching)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Unit tests (chess rules)
        run: gradle -p "$PROJECT_DIR" --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CHESS-ARENA-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
